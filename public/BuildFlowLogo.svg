<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' width='200' height='200'>
  <defs>
    <linearGradient id='roofGrad' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#F5B731'/>
      <stop offset='100%' stop-color='#E8A020'/>
    </linearGradient>
    <linearGradient id='houseGrad' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#2E7CF6'/>
      <stop offset='100%' stop-color='#1A5CC8'/>
    </linearGradient>
    <linearGradient id='chimGrad' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#1A4A9E'/>
      <stop offset='100%' stop-color='#133A80'/>
    </linearGradient>
    <filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='rgba(0,0,0,0.18)'/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx='100' cy='100' r='96' fill='white'/>
  
  <!-- House body -->
  <rect x='38' y='105' width='124' height='72' rx='4' fill='url(#houseGrad)' filter='url(#shadow)'/>
  
  <!-- Roof (triangle) -->
  <polygon points='100,28 168,108 32,108' fill='url(#roofGrad)' filter='url(#shadow)'/>
  
  <!-- Chimney -->
  <rect x='128' y='50' width='22' height='38' rx='3' fill='url(#chimGrad)'/>
  
  <!-- Window (white square) -->
  <rect x='83' y='120' width='34' height='34' rx='4' fill='white' opacity='0.92'/>
  <rect x='83' y='136' width='34' height='2' fill='rgba(46,124,246,0.3)'/>
  <rect x='100' y='120' width='2' height='34' fill='rgba(46,124,246,0.3)'/>
  
  <!-- Door hint -->
  <rect x='62' y='135' width='22' height='42' rx='3' fill='rgba(255,255,255,0.25)'/>
</svg>